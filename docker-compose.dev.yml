services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: imdev
      POSTGRES_PASSWORD: imdev
      POSTGRES_DB: imdev
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imdev -d imdev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
