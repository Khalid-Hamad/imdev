services:
  postgres:
    ports: !override []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-imdev}

  migrate:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-imdev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-imdev}

  app:
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - uses_uploads:/app/public/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-imdev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-imdev}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://im.dev}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://im.dev}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}

volumes:
  uses_uploads:
